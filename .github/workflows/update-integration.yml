name: 'Update Integration'

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: "Branch to be released"
        required: false
        default: "dav-stable"
  # enable this in your composition-repo with the correct time
  # schedule:
  #  - cron: '35 3 * * 1-5'

jobs:
  release:
    uses: hitobito/hitobito/.github/workflows/release.yml@master
    with:
      composition: ${{ github.repository }}
      release_type: 'regular'
      stage: 'integration'
      target_branch: ${{ inputs.branch || 'dav-stable' }}
    secrets: inherit
